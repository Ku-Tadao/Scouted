# Deploy: npx wrangler deploy --config cloudflare/wrangler.toml
# RIOT_API_KEY is a secret: npx wrangler secret put RIOT_API_KEY --config cloudflare/wrangler.toml
name = "scouted-riot-proxy"
main = "riot-proxy-worker.js"
compatibility_date = "2026-03-04"
workers_dev = true

kv_namespaces = [
  { binding = "SCOUTED_KV", id = "1d1a05acd9474835a8761572bd912c69" },
]

# /player limits; see the comment above player() in riot-proxy-worker.js for the math.
[[ratelimits]]
name = "PLAYER_IP_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "PLAYER_CLUSTER_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 4
  period = 60

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
